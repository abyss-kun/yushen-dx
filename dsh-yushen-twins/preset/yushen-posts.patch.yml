# 鱼神岗位预设（可选启用，不改默认）
#
# 为什么要有：工具的注册单位是"这套配置"，不是"这条会话"。只要装了插件，所有会话都看得见它的工具——
# 于是每条会话都背着 96 个工具（约 1.3 万字），回一句"在。"也要先读完。
#
# 这里按岗位列清楚各自的工具清单：员工只拿读写跑搜；她的工作台才拿鱼神那 20 个。
# 不设默认（agent-preset-registry 的 default 不动），所以没人选的时候行为跟现在一样。
#
# 启用：node scripts/presets.mjs install   （会先备份，可 revert）
# 回退：node scripts/presets.mjs revert
# === yushen-posts BEGIN ===
- insert:
    - id: preset-yushen-worker
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: yushen-worker
        name: 鱼神 · 员工（只带读写跑搜）
        description: 干活会话专用：不挂鱼神、不挂 QQ/B站，只留读写跑搜与必要的编排。约 20 个工具。
        order: 40
        plugins:
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-present
            name: '@deepseek-ai/dsh-tool-present'
          - id: compaction-basic
            name: '@deepseek-ai/dsh-compaction-basic'
          - id: command-compact
            name: '@deepseek-ai/dsh-command-compact'
          - id: tool-result-pruner
            name: '@deepseek-ai/dsh-compaction-tool-result-pruner'

    - id: preset-yushen-desk
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: yushen-desk
        name: 鱼神 · 她的工作台（鱼神 + 基础）
        description: 她的身体那条会话：鱼神自己的 20 个工具 + 读写跑搜；不挂 QQ/B站。
        order: 41
        plugins:
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-present
            name: '@deepseek-ai/dsh-tool-present'
          - id: compaction-basic
            name: '@deepseek-ai/dsh-compaction-basic'
          - id: command-compact
            name: '@deepseek-ai/dsh-command-compact'
          - id: tool-result-pruner
            name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
          - id: yushen
            name: dsh-yushen-twins
# === yushen-posts END ===
