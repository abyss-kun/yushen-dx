<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc"><title id="title">xiaoyu 星泡 — 待机动态样机</title><desc id="desc">透明背景独立光环，不含角色。证据核心默认隐藏，只有确认事件才由接入方显示。</desc><style>.ring{fill:none;stroke:#79D4EF;stroke-width:2}.accent-line{fill:none;stroke:#D8AC62;stroke-width:1.5}.accent-fill{fill:#D8AC62}.whale{fill:#79D4EF;stroke:#D8AC62;stroke-width:1}.evidence-core{display:none}.orbit{transform-origin:160px 160px}.ring{animation:breathe 5s ease-in-out infinite}.orbit{animation:orbit 12s linear infinite}@keyframes breathe{50%{opacity:.45}}@keyframes orbit{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><ellipse cx="160" cy="160" rx="50" ry="50" class="ring" opacity="1" stroke-dasharray="none"/><ellipse cx="160" cy="160" rx="67" ry="67" class="ring" opacity="0.87" stroke-dasharray="none"/><g class="orbit"><circle cx="160" cy="101" r="3" class="accent-fill"/></g><path class="whale" d="M109 157 Q137 132 177 150 Q192 155 203 143 L211 134 L213 148 L226 150 L214 158 Q198 180 162 179 Q125 179 109 157Z"/><circle cx="125" cy="154" r="2" fill="#FFFFFF"/></svg>