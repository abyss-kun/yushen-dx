<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc"><title id="title">zhaowei 定衡 — 待机动态样机</title><desc id="desc">透明背景独立光环，不含角色。证据核心默认隐藏，只有确认事件才由接入方显示。</desc><style>.ring{fill:none;stroke:#74B9B5;stroke-width:2}.accent-line{fill:none;stroke:#D8AC62;stroke-width:1.5}.accent-fill{fill:#D8AC62}.whale{fill:#74B9B5;stroke:#D8AC62;stroke-width:1}.evidence-core{display:none}.orbit{transform-origin:160px 160px}.ring{animation:breathe 5s ease-in-out infinite}.orbit{animation:orbit 12s linear infinite}@keyframes breathe{50%{opacity:.45}}@keyframes orbit{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><ellipse cx="160" cy="160" rx="50" ry="50" class="ring" opacity="1" stroke-dasharray="180 12"/><ellipse cx="160" cy="160" rx="67" ry="67" class="ring" opacity="0.87" stroke-dasharray="180 12"/><ellipse cx="160" cy="160" rx="84" ry="84" class="ring" opacity="0.74" stroke-dasharray="180 12"/><g class="orbit"><circle cx="160" cy="101" r="3" class="accent-fill"/></g><g class="evidence-core"><circle cx="160" cy="160" r="7" class="accent-fill"/></g></svg>