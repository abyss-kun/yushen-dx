<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc"><title id="title">zhaowei 照夜 — 待机动态样机</title><desc id="desc">透明背景独立光环，不含角色。证据核心默认隐藏，只有确认事件才由接入方显示。</desc><style>.ring{fill:none;stroke:#74B9B5;stroke-width:2}.accent-line{fill:none;stroke:#D8AC62;stroke-width:1.5}.accent-fill{fill:#D8AC62}.whale{fill:#74B9B5;stroke:#D8AC62;stroke-width:1}.evidence-core{display:none}.orbit{transform-origin:160px 160px}.ring{animation:breathe 5s ease-in-out infinite}.orbit{animation:orbit 12s linear infinite}@keyframes breathe{50%{opacity:.45}}@keyframes orbit{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><ellipse cx="160" cy="160" rx="50" ry="50" class="ring" opacity="1" stroke-dasharray="180 12"/><ellipse cx="160" cy="160" rx="67" ry="67" class="ring" opacity="0.87" stroke-dasharray="180 12"/><ellipse cx="160" cy="160" rx="84" ry="84" class="ring" opacity="0.74" stroke-dasharray="180 12"/><ellipse cx="160" cy="160" rx="101" ry="101" class="ring" opacity="0.61" stroke-dasharray="180 12"/><ellipse cx="160" cy="160" rx="118" ry="118" class="ring" opacity="0.48" stroke-dasharray="180 12"/><g class="orbit"><circle cx="160" cy="101" r="3" class="accent-fill"/></g><path class="accent-line" d="M80 100 Q115 44 185 58 L203 47 L202 65 L217 73 L198 79 Q151 59 119 94 Q98 117 91 139"/><g class="evidence-core"><circle cx="160" cy="160" r="7" class="accent-fill"/></g><path class="accent-line" d="M57 145 Q80 69 150 53 M170 53 Q240 69 263 145"/><path class="accent-line" d="M160 27 V45 M151 36 H169 M267 150 V168 M258 159 H276"/></svg>